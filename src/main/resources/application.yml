spring:
  application:
    name: Pori_BE
  datasource:
    url: ${DB_URL:jdbc:h2:mem:poridb;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret-key: ${JWT_SECRET_KEY:Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWtleS1tdXN0LWJlLWxvbmctZW5vdWdoLXRvLXNpZ24taHMyNTY=}
  issuer: ${JWT_ISSUER:Pori_BE}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

logging:
  level:
    com.pori: INFO
    org.springframework.security: WARN
