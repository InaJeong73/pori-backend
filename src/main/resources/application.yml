spring:
  application:
    name: Pori_BE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pori}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:asdf}
  hikari:
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    keep-alive-time: 300000
    maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://pori-five.vercel.app}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://pori-be-*.asia-northeast3.run.app}

jwt:
  secret: ${JWT_SECRET:pori-dev-secret-key-must-be-at-least-32-chars-long}
  access-token-expiry: 900000
  refresh-token-expiry: 1209600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  pre-loading-enabled: true

logging:
  level:
    com.pori: INFO
    org.springframework.security: WARN
