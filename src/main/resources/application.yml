spring:
  application:
    name: Pori_BE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pori}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

logging:
  level:
    com.pori: INFO
    org.springframework.security: WARN
