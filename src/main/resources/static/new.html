<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오 등록 — Pori</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Pori</a>
      <span class="header-sub">포트폴리오 등록</span>
    </div>
  </header>

  <main class="container form-container">
    <div class="form-header">
      <h2>포트폴리오 등록</h2>
      <p>입력한 내용을 기반으로 AI가 자동으로 평가합니다. 상세하게 작성할수록 점수가 높아집니다.</p>
    </div>

    <form id="portfolioForm">
      <div class="form-section">
        <h3 class="section-title">기본 정보</h3>
        <div class="form-row">
          <div class="form-group">
            <label>작성자 닉네임 <span class="required">*</span></label>
            <input type="text" name="authorName" placeholder="예: 김지현" required />
          </div>
          <div class="form-group">
            <label>포트폴리오 제목 <span class="required">*</span></label>
            <input type="text" name="title" placeholder="예: React & Next.js 프론트엔드 포트폴리오" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>희망 직무 <span class="required">*</span></label>
            <select name="jobCategory" required>
              <option value="">선택하세요</option>
              <option value="FRONTEND">프론트엔드</option>
              <option value="BACKEND">백엔드</option>
              <option value="FULLSTACK">풀스택</option>
              <option value="MOBILE">모바일</option>
              <option value="DATA_AI">데이터/AI</option>
              <option value="ETC">기타</option>
            </select>
          </div>
          <div class="form-group">
            <label>포트폴리오 링크 <span class="required">*</span></label>
            <input type="url" name="portfolioUrl" placeholder="https://..." required />
          </div>
        </div>
        <div class="form-group">
          <label>기술 스택 <span class="required">*</span> <small>(쉼표로 구분)</small></label>
          <input type="text" name="skills" placeholder="예: React, TypeScript, Next.js, TailwindCSS" required />
        </div>
      </div>

      <div class="form-section">
        <h3 class="section-title">프로젝트 상세</h3>
        <div class="form-group">
          <label>대표 프로젝트 <span class="required">*</span></label>
          <input type="text" name="mainProject" placeholder="예: 실시간 협업 메모 플랫폼" required />
        </div>
        <div class="form-group">
          <label>프로젝트 내 본인 역할 <span class="required">*</span></label>
          <textarea name="role" rows="3" placeholder="예: 프론트엔드 리드 및 WebSocket 통신 구조 설계, 컴포넌트 아키텍처 전반 담당" required></textarea>
        </div>
        <div class="form-group">
          <label>해결한 문제</label>
          <textarea name="problemSolved" rows="3" placeholder="예: 여러 명이 동시에 편집할 때 충돌이 발생하는 문제를 OT 알고리즘으로 해결했습니다."></textarea>
        </div>
        <div class="form-group">
          <label>사용한 기술과 이유</label>
          <textarea name="techReason" rows="3" placeholder="예: 빠른 렌더링과 SEO가 중요했기 때문에 Next.js를 선택했고, 상태 관리는 Zustand를 도입해 불필요한 리렌더링을 줄였습니다."></textarea>
        </div>
        <div class="form-group">
          <label>성과 또는 결과</label>
          <textarea name="result" rows="3" placeholder="예: 동시 편집 지연을 150ms 이하로 줄였고, Lighthouse 성능 점수 94점을 달성했습니다."></textarea>
        </div>
      </div>

      <div class="form-section">
        <h3 class="section-title">링크 및 요약</h3>
        <div class="form-row">
          <div class="form-group">
            <label>GitHub 링크</label>
            <input type="url" name="githubUrl" placeholder="https://github.com/..." />
          </div>
          <div class="form-group">
            <label>배포 링크</label>
            <input type="url" name="deployUrl" placeholder="https://..." />
          </div>
        </div>
        <div class="form-group">
          <label>포트폴리오 요약 <span class="required">*</span></label>
          <textarea name="summary" rows="4" placeholder="전체 포트폴리오를 2~3문장으로 요약해 주세요. 이 내용이 목록 카드에 표시됩니다." required></textarea>
        </div>
      </div>

      <div class="form-actions">
        <a href="/" class="btn btn-ghost">취소</a>
        <button type="submit" class="btn btn-primary" id="submitBtn">AI 평가 받기</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('portfolioForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = '평가 중...';
      btn.disabled = true;

      const fd = new FormData(e.target);
      const body = {
        authorName: fd.get('authorName'),
        title: fd.get('title'),
        jobCategory: fd.get('jobCategory'),
        portfolioUrl: fd.get('portfolioUrl'),
        skills: fd.get('skills').split(',').map(s => s.trim()).filter(Boolean),
        mainProject: fd.get('mainProject'),
        role: fd.get('role'),
        problemSolved: fd.get('problemSolved') || null,
        techReason: fd.get('techReason') || null,
        result: fd.get('result') || null,
        githubUrl: fd.get('githubUrl') || null,
        deployUrl: fd.get('deployUrl') || null,
        summary: fd.get('summary'),
      };

      try {
        const res = await fetch('/api/portfolios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const json = await res.json();
        if (!res.ok) {
          alert('등록 실패: ' + (json.message || res.status));
          btn.textContent = 'AI 평가 받기';
          btn.disabled = false;
          return;
        }
        sessionStorage.setItem('evalResult', JSON.stringify(json.results));
        location.href = `/result.html?id=${json.results.id}`;
      } catch (err) {
        alert('서버 연결 오류가 발생했습니다.');
        btn.textContent = 'AI 평가 받기';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
