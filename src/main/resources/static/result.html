<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>평가 결과 — Pori</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Pori</a>
      <span class="header-sub">AI 평가 결과</span>
    </div>
  </header>

  <main class="container result-container" id="app">
    <div class="loading">결과를 불러오는 중...</div>
  </main>

  <script>
    const CATEGORY_LABELS = {
      projectClarity: '프로젝트 설명 구체성',
      problemSolving: '문제 해결 명확성',
      techJustification: '기술 선택 타당성',
      contribution: '기여도 명확성',
      impact: '성과/결과 구체성',
      evidence: '근거 자료 포함',
      jobFit: '직무 적합성',
      readability: '문서 가독성',
    };

    async function load() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');

      let data = null;
      const cached = sessionStorage.getItem('evalResult');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (String(parsed.id) === String(id)) {
          data = parsed;
          sessionStorage.removeItem('evalResult');
        }
      }

      if (!data) {
        try {
          const res = await fetch(`/api/portfolios/${id}`);
          const json = await res.json();
          if (res.ok) data = json.results;
        } catch (_) {}
      }

      if (!data) {
        document.getElementById('app').innerHTML = '<p class="error-msg">결과를 불러올 수 없습니다.</p>';
        return;
      }

      render(data);
    }

    function render(d) {
      const isPublic = d.isPublic;
      const scoreClass = gradeClass(d.grade);

      const categoryRows = Object.entries(d.categoryScores || {}).map(([key, val]) => `
        <div class="category-row">
          <span class="category-label">${CATEGORY_LABELS[key] || key}</span>
          <div class="bar-wrap">
            <div class="bar" style="width:${val}%"></div>
          </div>
          <span class="category-score">${val}점</span>
        </div>`).join('');

      const strengths = (d.strengths || []).map(s => `<li>${s}</li>`).join('');
      const improvements = (d.improvements || []).map(s => `<li>${s}</li>`).join('');

      document.getElementById('app').innerHTML = `
        <div class="result-card">
          <div class="score-hero ${scoreClass}">
            <div class="score-number">${d.poriScore}<span class="score-unit">점</span></div>
            <div class="grade-label">${d.grade}</div>
            <div class="public-badge ${isPublic ? 'public' : 'private'}">
              ${isPublic ? '✓ 공개 게시판 등록됨' : '✗ 비공개 — 작성자만 확인 가능'}
            </div>
          </div>

          <div class="result-message">
            ${isPublic
              ? `<p class="msg-public">상위 레퍼런스로 등록 가능한 포트폴리오입니다. 🎉</p>`
              : `<p class="msg-private">아직 공개하기에는 정보가 부족합니다.<br>아래 개선점을 반영한 뒤 다시 제출해보세요.</p>`}
          </div>

          <div class="result-section">
            <h3>항목별 점수</h3>
            <div class="category-list">${categoryRows}</div>
          </div>

          <div class="result-row">
            <div class="result-section">
              <h3>강점</h3>
              <ul class="feedback-list strength-list">${strengths}</ul>
            </div>
            <div class="result-section">
              <h3>개선점</h3>
              <ul class="feedback-list improve-list">${improvements || '<li>없음</li>'}</ul>
            </div>
          </div>

          <div class="result-section recommendation">
            <h3>추천 보완 방향</h3>
            <p>${d.recommendation || ''}</p>
          </div>

          <div class="result-actions">
            ${isPublic ? `<a href="/detail.html?id=${d.id}" class="btn btn-primary">상세 페이지 보기</a>` : ''}
            <a href="/" class="btn btn-secondary">목록으로</a>
            <a href="/new.html" class="btn btn-ghost">다시 작성하기</a>
          </div>
        </div>`;
    }

    function gradeClass(grade) {
      if (grade === 'Excellent') return 'grade-excellent';
      if (grade === 'Strong') return 'grade-strong';
      if (grade === 'Standard') return 'grade-standard';
      return 'grade-needs';
    }

    load();
  </script>
</body>
</html>
