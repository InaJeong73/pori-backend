<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pori — 검증된 개발자 포트폴리오</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Pori</a>
      <span class="header-sub">AI가 검증한 개발자 포트폴리오</span>
      <a href="/new.html" class="btn btn-primary">포트폴리오 등록</a>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>검증된 포트폴리오를 탐색하세요</h1>
      <p>Pori Score 60점 이상의 포트폴리오만 공개됩니다. 직무와 점수 구간으로 원하는 레퍼런스를 찾아보세요.</p>
    </section>

    <section class="filter-bar">
      <div class="filter-group">
        <label class="filter-label">직무</label>
        <div class="filter-chips" id="jobFilter">
          <button class="chip active" data-value="">전체</button>
          <button class="chip" data-value="frontend">프론트엔드</button>
          <button class="chip" data-value="backend">백엔드</button>
          <button class="chip" data-value="fullstack">풀스택</button>
          <button class="chip" data-value="mobile">모바일</button>
          <button class="chip" data-value="data_ai">데이터/AI</button>
          <button class="chip" data-value="etc">기타</button>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">점수 구간</label>
        <div class="filter-chips" id="scoreFilter">
          <button class="chip active" data-value="0">전체</button>
          <button class="chip" data-value="60">60점 이상</button>
          <button class="chip" data-value="80">80점 이상</button>
          <button class="chip" data-value="90">90점 이상</button>
        </div>
      </div>
    </section>

    <div id="loading" class="loading">불러오는 중...</div>
    <div id="empty" class="empty-state" style="display:none">
      <p>조건에 맞는 포트폴리오가 없습니다.</p>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </main>

  <script>
    const state = { jobCategory: '', minScore: 0 };

    async function fetchPortfolios() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('cardGrid').innerHTML = '';
      document.getElementById('empty').style.display = 'none';

      const params = new URLSearchParams();
      if (state.jobCategory) params.set('jobCategory', state.jobCategory);
      if (state.minScore > 0) params.set('minScore', state.minScore);

      try {
        const res = await fetch(`/api/portfolios?${params}`);
        const json = await res.json();
        const items = json.results || [];
        document.getElementById('loading').style.display = 'none';

        if (items.length === 0) {
          document.getElementById('empty').style.display = 'block';
          return;
        }
        document.getElementById('cardGrid').innerHTML = items.map(renderCard).join('');
      } catch (e) {
        document.getElementById('loading').textContent = '불러오기 실패. 서버가 실행 중인지 확인해 주세요.';
      }
    }

    function renderCard(p) {
      const gradeBadge = gradeClass(p.grade);
      const topBadge = p.isTopReference ? '<span class="badge badge-top">상위 레퍼런스</span>' : '';
      const trustBadge = p.isHighTrust ? '<span class="badge badge-trust">고신뢰</span>' : '';
      const skills = (p.skills || []).slice(0, 4).map(s => `<span class="skill-tag">${s}</span>`).join('');

      return `
        <article class="card" onclick="location.href='/detail.html?id=${p.id}'">
          <div class="card-header">
            <span class="job-tag">${jobLabel(p.jobCategory)}</span>
            <div class="badges">${topBadge}${trustBadge}</div>
          </div>
          <h3 class="card-title">${esc(p.title)}</h3>
          <p class="card-author">${esc(p.authorName)}</p>
          <p class="card-summary">${esc(p.summary)}</p>
          <div class="skill-list">${skills}</div>
          <div class="card-footer">
            <span class="score-badge ${gradeBadge}">${p.poriScore}점</span>
            <span class="grade-text">${p.grade}</span>
          </div>
        </article>`;
    }

    function gradeClass(grade) {
      if (grade === 'Excellent') return 'score-excellent';
      if (grade === 'Strong') return 'score-strong';
      if (grade === 'Standard') return 'score-standard';
      return 'score-needs';
    }

    function jobLabel(cat) {
      const map = { frontend:'프론트엔드', backend:'백엔드', fullstack:'풀스택', mobile:'모바일', data_ai:'데이터/AI', etc:'기타' };
      return map[cat] || cat;
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('jobFilter').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('#jobFilter .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.jobCategory = chip.dataset.value;
      fetchPortfolios();
    });

    document.getElementById('scoreFilter').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('#scoreFilter .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.minScore = parseInt(chip.dataset.value);
      fetchPortfolios();
    });

    fetchPortfolios();
  </script>
</body>
</html>
