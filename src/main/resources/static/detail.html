<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오 상세 — Pori</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="logo">Pori</a>
      <a href="/" class="btn btn-ghost">← 목록으로</a>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading">불러오는 중...</div>
  </main>

  <script>
    const JOB_LABELS = { frontend:'프론트엔드', backend:'백엔드', fullstack:'풀스택', mobile:'모바일', data_ai:'데이터/AI', etc:'기타' };
    const CAT_LABELS = {
      projectClarity:'프로젝트 설명 구체성', problemSolving:'문제 해결 명확성',
      techJustification:'기술 선택 타당성', contribution:'기여도 명확성',
      impact:'성과/결과 구체성', evidence:'근거 자료 포함',
      jobFit:'직무 적합성', readability:'문서 가독성',
    };

    async function load() {
      const id = new URLSearchParams(location.search).get('id');
      try {
        const res = await fetch(`/api/portfolios/${id}`);
        const json = await res.json();
        if (!res.ok) {
          document.getElementById('app').innerHTML = `<div class="error-card"><p>${json.message || '공개되지 않은 포트폴리오입니다.'}</p><a href="/" class="btn btn-secondary">목록으로</a></div>`;
          return;
        }
        render(json.results);
      } catch (_) {
        document.getElementById('app').innerHTML = '<p class="error-msg">불러오기 실패</p>';
      }
    }

    function render(d) {
      const skills = (d.skills || []).map(s => `<span class="skill-tag">${esc(s)}</span>`).join('');
      const topBadge = d.isTopReference ? '<span class="badge badge-top">상위 레퍼런스</span>' : '';
      const trustBadge = d.isHighTrust ? '<span class="badge badge-trust">고신뢰</span>' : '';
      const strengths = (d.strengths || []).map(s => `<li>${esc(s)}</li>`).join('');
      const improvements = (d.improvements || []).map(s => `<li>${esc(s)}</li>`).join('');
      const categoryRows = Object.entries(d.categoryScores || {}).map(([k, v]) => `
        <div class="category-row">
          <span class="category-label">${CAT_LABELS[k] || k}</span>
          <div class="bar-wrap"><div class="bar" style="width:${v}%"></div></div>
          <span class="category-score">${v}점</span>
        </div>`).join('');

      document.getElementById('app').innerHTML = `
        <div class="detail-layout">
          <div class="detail-main">
            <div class="detail-title-row">
              <div>
                <span class="job-tag">${JOB_LABELS[d.jobCategory] || d.jobCategory}</span>
                ${topBadge}${trustBadge}
              </div>
              <h1 class="detail-title">${esc(d.title)}</h1>
              <p class="detail-author">by ${esc(d.authorName)}</p>
            </div>

            <div class="detail-section">
              <h3>대표 프로젝트</h3>
              <p>${esc(d.mainProject)}</p>
            </div>
            ${d.role ? `<div class="detail-section"><h3>본인 역할</h3><p>${esc(d.role)}</p></div>` : ''}
            ${d.problemSolved ? `<div class="detail-section"><h3>해결한 문제</h3><p>${esc(d.problemSolved)}</p></div>` : ''}
            ${d.techReason ? `<div class="detail-section"><h3>기술 선택 이유</h3><p>${esc(d.techReason)}</p></div>` : ''}
            ${d.result ? `<div class="detail-section"><h3>성과 / 결과</h3><p>${esc(d.result)}</p></div>` : ''}

            <div class="detail-section">
              <h3>포트폴리오 요약</h3>
              <p class="summary-text">${esc(d.summary)}</p>
            </div>

            <div class="detail-section">
              <h3>AI 평가 요약</h3>
              <div class="ai-summary">
                <div class="result-row">
                  <div style="flex:1">
                    <h4>강점</h4>
                    <ul class="feedback-list strength-list">${strengths}</ul>
                  </div>
                  <div style="flex:1">
                    <h4>개선점</h4>
                    <ul class="feedback-list improve-list">${improvements || '<li>없음</li>'}</ul>
                  </div>
                </div>
                <p class="recommendation">${esc(d.recommendation || '')}</p>
              </div>
            </div>
          </div>

          <aside class="detail-sidebar">
            <div class="score-card ${gradeClass(d.grade)}">
              <div class="score-number">${d.poriScore}<span class="score-unit">점</span></div>
              <div class="grade-label">${d.grade}</div>
            </div>

            <div class="sidebar-section">
              <h4>기술 스택</h4>
              <div class="skill-list">${skills}</div>
            </div>

            <div class="sidebar-section">
              <h4>링크</h4>
              <div class="link-list">
                <a href="${esc(d.portfolioUrl)}" target="_blank" class="link-item">📄 포트폴리오</a>
                ${d.githubUrl ? `<a href="${esc(d.githubUrl)}" target="_blank" class="link-item">🐙 GitHub</a>` : ''}
                ${d.deployUrl ? `<a href="${esc(d.deployUrl)}" target="_blank" class="link-item">🚀 배포 링크</a>` : ''}
              </div>
            </div>

            <div class="sidebar-section">
              <h4>항목별 점수</h4>
              <div class="category-list">${categoryRows}</div>
            </div>
          </aside>
        </div>`;
    }

    function gradeClass(grade) {
      if (grade === 'Excellent') return 'grade-excellent';
      if (grade === 'Strong') return 'grade-strong';
      if (grade === 'Standard') return 'grade-standard';
      return 'grade-needs';
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    load();
  </script>
</body>
</html>
